name: Regenerate review AMD assets (temporary)
on:
  push:
    branches: [review-0.3.7]
    paths:
      - '.github/workflows/regenerate-review-amd.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.ref == 'refs/heads/review-0.3.7'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing pinned minifier
        run: npm install --no-save --no-package-lock --ignore-scripts terser@5.51.2
      - name: Compile and test
        run: |
          node tools/build-amd.js
          node --test tests/dashboard.test.cjs tests/student_monitor.test.cjs
      - name: Commit regenerated assets to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amd/build
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate standalone AMD assets for 0.3.7"
            git push origin HEAD:review-0.3.7
          fi
