name: CD Live Exam Control verification
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the AMD minifier
        run: npm install --no-save --no-package-lock --ignore-scripts terser@5.51.2
      - run: node --test tests/dashboard.test.cjs tests/student_monitor.test.cjs
      - name: Verify bundled AMD
        run: |
          node tools/build-amd.js
          git diff --exit-code -- amd/build

  moodle:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        database: [pgsql, mariadb]
    services:
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      mariadb:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:11' || '' }}
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: --health-cmd="healthcheck.sh --connect --innodb_initialized" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pgsql, mysqli, zip, gd, soap, intl
          ini-values: max_input_vars=5000
          coverage: none
      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$PWD/ci/bin" >> "$GITHUB_PATH"
          echo "$PWD/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> "$GITHUB_ENV"
      - name: Install Moodle 4.5 with the plugin
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_405_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1
      - run: moodle-plugin-ci phplint
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci validate
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci savepoints
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpcs --max-warnings 0
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci grunt --tasks=gherkinlint --tasks=stylelint --max-lint-warnings 0
      - name: Compile the Moodle-native AMD assets
        if: ${{ !cancelled() }}
        working-directory: moodle
        run: npx grunt amd --root=mod/quiz/accessrule/examfocuslive --max-lint-warnings=0
      - name: Save Moodle-native AMD assets
        if: ${{ !cancelled() && matrix.database == 'pgsql' }}
        uses: actions/upload-artifact@v4
        with:
          name: moodle-native-amd
          path: moodle/mod/quiz/accessrule/examfocuslive/amd/build/
          if-no-files-found: error
      - if: ${{ !cancelled() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

  package:
    needs: [javascript, moodle]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: moodle-native-amd
          path: amd/build/
      - name: Build the Moodle upload from tested source and Moodle-native AMD
        run: python3 tools/build_release.py dist
      - uses: actions/upload-artifact@v4
        with:
          name: CD-Live-Exam-Control
          path: dist/CD-Live-Exam-Control-*.zip
          if-no-files-found: error
